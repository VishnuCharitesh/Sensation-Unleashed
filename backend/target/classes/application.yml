server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sensation-backend
  profiles:
    active: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:sensationdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

sensation:
  cors:
    allowed-origins: ${SENSATION_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${SENSATION_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  subscription:
    monthly-price: 500.00
    currency: INR
    vip-discount-percent: 30.00
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_sensation_12345}
    key-secret: ${RAZORPAY_KEY_SECRET:secret_sensation_67890}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:whsec_sensation_abc123}

logging:
  level:
    root: INFO
    com.sensation: DEBUG
    org.springframework.security: INFO
